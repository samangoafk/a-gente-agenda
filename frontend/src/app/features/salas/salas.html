<div class="pagina-salas">
  <app-header></app-header>

  <main class="conteudo-salas">
    <div class="topo-boas-vindas">
      <div class="texto-saudacao">
        <span class="data-hoje">{{ dataAtualFormatada }}</span>
        <h1>Olá, Marina! <span class="texto-suave">Pronta para sua próxima aula?</span></h1>
      </div>
    </div>

    <!-- Barra de Ferramentas / Calendário -->
    <div class="barra-ferramentas">
      <div class="filtro-data-container">
        <div class="filtro-data" (click)="toggleCalendario()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00a884" stroke-width="2">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          <div class="campo-data">
            <label>DATA DA RESERVA</label>
            <span class="texto-data-reserva">{{ dataReservaTexto }}</span>
          </div>
          <svg class="seta-calendario" [class.aberto]="exibirCalendario" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>

        <div class="popover-calendario" *ngIf="exibirCalendario">
          <div class="cabecalho-calendario">
            <button type="button" (click)="mudarMes(-1)">&lsaquo;</button>
            <span>{{ mesAnoExibicao | titlecase }}</span>
            <button type="button" (click)="mudarMes(1)">&rsaquo;</button>
          </div>

          <div class="grid-semana">
            <span *ngFor="let diaSemana of diasDaSemana">{{ diaSemana }}</span>
          </div>

          <div class="grid-dias">
            <button 
              *ngFor="let dia of diasCalendario"
              type="button"
              class="celula-dia"
              [class.fora-mes]="!dia.mesAtual"
              [class.desabilitado]="dia.desabilitado"
              [class.selecionado]="dia.selecionado"
              [class.hoje]="dia.hoje"
              [disabled]="dia.desabilitado"
              (click)="selecionarData(dia)">
              {{ dia.numeroDia }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="cabecalho-lista">
      <div>
        <h2>Salas e laboratórios</h2>
        <p>Escolha um ambiente para consultar os horários disponíveis.</p>
      </div>

      <div class="botoes-categoria">
        <button 
          class="btn-categoria" 
          [class.ativo]="filtroAtual === 'todos'" 
          (click)="alterarFiltro('todos')">
          Todos
        </button>
        <button 
          class="btn-categoria" 
          [class.ativo]="filtroAtual === 'livre'" 
          (click)="alterarFiltro('livre')">
          Disponíveis
        </button>
      </div>
    </div>

    <!-- Cards de Salas -->
    <div class="grade-salas">
      <app-card-status-sala
        *ngFor="let sala of salasExibidas"
        [id]="sala.id"
        [nome]="sala.nome"
        [tipo]="sala.tipo"
        [capacidade]="sala.capacidade"
        [status]="sala.status"
        [proximoHorario]="sala.proximoHorario"
        (reservar)="abrirModalReserva($event)">
      </app-card-status-sala>
    </div>
  </main>

  <app-pop-up-reserva-sala
    [exibe]="exibirModal"
    [nomeSala]="salaSelecionadaNome"
    [status]="salaSelecionadaStatus"
    (fechar)="fecharModal()"
    (confirmar)="confirmarReservaModal()"
    (escolherOutraData)="alterarDataModal()">
  </app-pop-up-reserva-sala>
</div>
